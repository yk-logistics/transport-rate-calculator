{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-2xl font-bold">{{ title }}</h1>
  <a href="/maint" class="btn bg-slate-200 hover:bg-slate-300">← Dashboard</a>
</div>
<div class="p-8 bg-white border rounded-lg text-center">
  <div class="text-5xl mb-3">{{ icon }}</div>
  <p class="text-lg font-semibold mb-2">{{ headline }}</p>
  <p class="text-slate-500 mb-4">{{ description }}</p>
  <p class="text-sm text-slate-400">Schema มีครบแล้ว ({{ table_info }}) — UI จะต่อในคลื่นถัดไป</p>
</div>
{% endblock %}
