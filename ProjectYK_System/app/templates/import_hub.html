{% extends "base.html" %}
{% block title %}Import Wizard — Project YK{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-bold">Import Wizard</h1>
  <span class="text-sm text-gray-500">อัพโหลดไฟล์ Excel → เลือก Sheet → Preview → Import</span>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

  <!-- ── LEFT: Upload form ── -->
  <div class="bg-white rounded-lg border shadow-sm p-6">
    <h2 class="font-semibold text-lg mb-4">1. เลือกไฟล์ & ชีท</h2>

    <form id="import-form" class="space-y-4">
      <!-- hidden fields populated by sub-steps -->
      <div id="hidden-fields"></div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ไฟล์ Excel (.xlsx / .xlsm)</label>
        <input type="file" name="file" accept=".xlsx,.xlsm,.xls"
               class="block w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-4
                      file:rounded file:border-0 file:text-sm file:font-medium
                      file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
               hx-post="/import/sheets"
               hx-encoding="multipart/form-data"
               hx-target="#sheet-picker-area"
               hx-trigger="change"
               hx-indicator="#upload-spinner">
        <span id="upload-spinner" class="htmx-indicator text-xs text-gray-400 mt-1 block">กำลังอ่านชีท…</span>
      </div>

      <div id="sheet-picker-area"></div>

      <div id="preview-area"></div>
    </form>
  </div>

  <!-- ── RIGHT: Import history ── -->
  <div class="bg-white rounded-lg border shadow-sm p-6">
    <h2 class="font-semibold text-lg mb-4">ประวัติ Import</h2>
    <div id="history-table"
         hx-get="/import/history-partial"
         hx-trigger="load"
         hx-swap="innerHTML">
      <p class="text-gray-400 text-sm">กำลังโหลด…</p>
    </div>
  </div>

</div>
{% endblock %}
