<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>สลิปเงินเดือน · {{ employee.full_name }} · {{ run.site_code }} {{ run.pay_cycle_tag }}</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{--wb-ink:#15233f;--wb-soft:#3a4a68;--wb-paper:#fbfaf6;--wb-line:#e3e0d6;--wb-brass:#b07d2b;--wb-pos:#1f7a4d;--wb-neg:#b23b3b;--wb-muted:#9a9789;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#edeae1;font-family:"IBM Plex Sans Thai","Sarabun",sans-serif;color:var(--wb-ink);font-size:12px;}
.no-print{}
/* ===== container ===== */
.slip{max-width:900px;margin:0 auto 22px;background:var(--wb-paper);border:1px solid var(--wb-line);}
/* ===== masthead ===== */
.wb-mast{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 24px 13px;border-bottom:2px solid var(--wb-ink);}
.wb-brand{font-weight:700;font-size:18px;letter-spacing:.5px;}
.wb-brand small{display:block;font-weight:500;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--wb-brass);margin-top:2px;}
.wb-mast-meta{text-align:right;font-size:11px;color:var(--wb-soft);line-height:1.5;}
.wb-mast-meta b{color:var(--wb-ink);}
/* ===== who strip ===== */
.wb-who{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.1fr;border-bottom:1px solid var(--wb-line);}
.wb-who>div{padding:10px 14px;border-right:1px solid var(--wb-line);}
.wb-who>div:last-child{border-right:none;}
.wb-k{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--wb-muted);}
.wb-v{font-size:14px;font-weight:600;margin-top:2px;}
/* ===== money ribbon ===== */
.wb-ribbon{display:flex;background:var(--wb-ink);color:#fff;}
.wb-ribbon .seg{flex:1;padding:12px 16px;position:relative;}
.wb-ribbon .seg+.seg::before{content:"";position:absolute;left:0;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:11px;height:11px;background:var(--wb-ink);border-right:1px solid rgba(255,255,255,.18);border-top:1px solid rgba(255,255,255,.18);}
.wb-ribbon .lab{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.6);}
.wb-ribbon .fig{font-family:"IBM Plex Mono";font-size:18px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;}
.wb-ribbon .seg.minus .fig{color:#f0a3a3;}
.wb-ribbon .seg.net{background:var(--wb-brass);flex:1.3;}
.wb-ribbon .seg.net .lab{color:rgba(255,255,255,.85);}
.wb-ribbon .seg.net .fig{font-size:24px;font-weight:700;color:#fff;}
.wb-ribbon .seg.net .fig.neg{color:#ffd9d9;}
/* ===== body 2-col ===== */
.wb-body{display:grid;grid-template-columns:1.05fr 1fr;}
.wb-col{padding:16px 18px;}
.wb-col.left{border-right:1px solid var(--wb-line);}
.wb-sec{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--wb-brass);font-weight:600;margin:0 0 9px;display:flex;justify-content:space-between;border-bottom:1px solid var(--wb-ink);padding-bottom:5px;}
.wb-sec span{color:var(--wb-muted);font-weight:500;letter-spacing:0;}
.wb-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--wb-brass);font-weight:600;margin:16px 0 7px;}
.wb-chip{padding:1px 5px;border:1px solid var(--wb-line);border-radius:3px;margin-right:3px;font-size:10px;}
/* daily table */
table.daily{width:100%;border-collapse:collapse;font-size:11px;}
table.daily th{text-align:left;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--wb-muted);font-weight:600;padding:0 5px 5px;border-bottom:1px solid var(--wb-line);}
table.daily th.num{text-align:right;}
table.daily td{padding:3px 5px;border-bottom:1px solid #efece3;vertical-align:top;}
table.daily td.num{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;white-space:nowrap;}
.c-date{white-space:nowrap;color:var(--wb-soft);font-family:"IBM Plex Mono";font-size:10px;}
.c-route{line-height:1.3;}
.c-trip{font-weight:600;}
.c-cut{color:var(--wb-neg);}
.row-tank{background:#fdf6e3;}
.wb-muted{color:var(--wb-muted);}
.tag-free{display:inline-block;font-size:8px;background:#e7f1ea;color:var(--wb-pos);padding:0 4px;border-radius:2px;}
.tag-cut{display:inline-block;font-size:8px;background:#f7e3e3;color:var(--wb-neg);padding:0 4px;border-radius:2px;}
.tag-co{display:inline-block;font-size:8px;background:#eceae2;color:var(--wb-muted);padding:0 4px;border-radius:2px;}
.tag-grade{display:inline-block;font-size:8px;background:#eef2f7;color:#3a4a68;padding:0 4px;border-radius:2px;border:1px solid #d4dae3;}
table.daily tfoot td{border-top:2px solid var(--wb-ink);border-bottom:none;padding-top:5px;font-weight:600;}
table.daily tfoot .ft-cut td{border-top:none;color:var(--wb-neg);font-size:10px;}
table.daily tfoot .ft-free{font-weight:400;font-size:9px;color:var(--wb-pos);}
.wb-foot-note{font-size:9px;color:var(--wb-muted);margin-top:4px;}
/* ledger */
.wb-ledger{font-size:12.5px;}
.lr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #efece3;}
.lr .amt{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;}
.lr.sub{font-size:11px;color:var(--wb-soft);padding:2px 0 2px 14px;}
.lr.sub.off{color:var(--wb-muted);}
.lr.sum{border-top:1.5px solid var(--wb-ink);border-bottom:none;margin-top:5px;padding-top:6px;font-weight:700;font-size:13px;}
.lr.minus .amt{color:var(--wb-neg);}
.dep-badge{font-size:9px;background:var(--wb-ink);color:#fff;padding:1px 6px;border-radius:2px;letter-spacing:.5px;margin-left:5px;}
/* gauge */
.wb-gauge{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.wb-gauge .cell{background:#fff;border:1px solid var(--wb-line);padding:7px 9px;}
.wb-gauge .g-v{font-family:"IBM Plex Mono";font-size:14px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;}
.wb-footer{display:flex;justify-content:space-between;padding:9px 18px;border-top:1px solid var(--wb-line);font-size:10px;color:var(--wb-muted);}
/* ===== summary/transfer pages (.block) ===== */
.block{max-width:900px;margin:0 auto 22px;background:var(--wb-paper);border:1px solid var(--wb-line);page-break-after:always;}
.block:last-child{page-break-after:auto;}
.bk-mast{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 24px 13px;border-bottom:2px solid var(--wb-ink);}
.doc-kind{display:inline-block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#fff;background:var(--wb-ink);padding:3px 10px;margin-bottom:6px;}
.bk-wrap{padding:16px 22px 20px;}
.totband{display:flex;border:1px solid var(--wb-line);background:#fff;margin-bottom:16px;}
.totband .cell{flex:1;padding:12px 16px;border-right:1px solid var(--wb-line);}
.totband .cell:last-child{border-right:none;background:var(--wb-ink);color:#fff;flex:1.3;}
.totband .cell.pay:last-child{background:var(--wb-brass);}
.totband .cell:last-child .wb-k{color:rgba(255,255,255,.7);}
.totband .t-v{font-family:"IBM Plex Mono";font-size:20px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;}
.totband .cell:last-child .t-v{font-size:24px;font-weight:700;}
table.run{width:100%;border-collapse:collapse;font-size:12px;}
table.run th{text-align:left;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--wb-muted);font-weight:600;padding:0 8px 6px;border-bottom:2px solid var(--wb-ink);}
table.run th.num{text-align:right;}
table.run td{padding:6px 8px;border-bottom:1px solid #efece3;}
table.run td.num{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;white-space:nowrap;}
.r-idx{color:var(--wb-muted);font-family:"IBM Plex Mono";width:26px;}
.r-name{font-weight:600;}
.r-mode,.r-bank{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--wb-soft);}
.r-num.minus{color:var(--wb-neg);}
.r-num.net{font-weight:700;}
.r-num.net.neg{color:var(--wb-neg);}
table.run tfoot td{border-top:2px solid var(--wb-ink);border-bottom:none;padding-top:8px;font-weight:700;font-size:12.5px;}
.bk-foot{display:flex;justify-content:space-between;padding:9px 22px;border-top:1px solid var(--wb-line);font-size:10px;color:var(--wb-muted);}
.noteform input{width:150px;font-size:11px;}
/* ===== density (สลิปยาว) ===== */
.slip.dense table.daily{font-size:9px;}
.slip.dense table.daily td,.slip.dense table.daily th{padding:1px 4px;}
.slip.dense .lr,.slip.dense .lr.sum{font-size:10px;padding:1.5px 0;}
.slip.ultra table.daily{font-size:8px;}
.slip.ultra table.daily td,.slip.ultra table.daily th{padding:.5px 3px;}
.slip.ultra .lr,.slip.ultra .lr.sum{font-size:9px;padding:1px 0;}
.slip.ultra .wb-ribbon .fig{font-size:15px;}
.slip.ultra .wb-ribbon .seg.net .fig{font-size:19px;}
/* ===== PRINT: พื้นขาวสนิททุกที่ (ประหยัดหมึก) ===== */
@media print{
  html,body{background:#fff !important;}
  .no-print{display:none !important;}
  .slip,.block{background:#fff !important;border:1px solid #333;max-width:100%;margin:0;}
  .slip{page-break-after:always;}
  .slip:last-child{page-break-after:auto;}
  .wb-mast,.bk-mast{border-bottom:2px solid #000;background:#fff !important;}
  .wb-brand small{color:#000;}
  .doc-kind{background:#fff !important;color:#000;border:1.5px solid #000;}
  .wb-who,.wb-who>div{background:#fff !important;}
  /* ribbon → ขาว + กรอบ */
  .wb-ribbon{background:#fff !important;color:#000;border-top:1px solid #000;border-bottom:2px solid #000;}
  .wb-ribbon .seg{border-right:1px solid #999;background:#fff !important;}
  .wb-ribbon .seg:last-child{border-right:none;}
  .wb-ribbon .seg+.seg::before{display:none;}
  .wb-ribbon .lab{color:#444;}
  .wb-ribbon .fig,.wb-ribbon .seg.minus .fig{color:#000;}
  .wb-ribbon .seg.net{background:#fff !important;border-left:3px double #000;}
  .wb-ribbon .seg.net .lab{color:#000;font-weight:700;}
  .wb-ribbon .seg.net .fig{color:#000;}
  /* eyebrow → ดำ */
  .wb-sec,.wb-sub{color:#000;}
  .wb-gauge .cell{background:#fff !important;border:1px solid #999;}
  .dep-badge{background:#fff !important;color:#000;border:1px solid #000;}
  .row-tank{background:#fff !important;}
  .tag-free{background:#fff !important;border:1px solid #2a7a4d;}
  .tag-cut{background:#fff !important;border:1px solid #a33;}
  .tag-co{background:#fff !important;border:1px solid #999;}
  /* summary/transfer totband → ขาว */
  .totband,.totband .cell{background:#fff !important;}
  .totband .cell:last-child{color:#000;border-left:3px double #000;}
  .totband .cell:last-child .wb-k{color:#000;font-weight:700;}
  @page{size:A4 portrait;margin:7mm;}
}
</style>
</head>
<body>

<div class="toolbar">
  <a href="/payroll/{{ run.id }}/employee/{{ employee.id }}">← กลับหน้ารายละเอียด</a>
  <div>
    <button onclick="window.print()">🖨 พิมพ์สลิป</button>
  </div>
</div>

{% include "_slip_body.html" %}

<script>
(function(){
  const box = document.getElementById("pettyLines");
  if (!box) return;
  const note = document.getElementById("pettyHiddenNote");
  const rows = Array.from(box.querySelectorAll(".petty-row"));

  function checkedCats(){
    return new Set(Array.from(document.querySelectorAll(".pettyCatChk"))
                        .filter(c => c.checked).map(c => c.value));
  }
  function viewMode(){
    const r = document.querySelector('input[name="pettyView"]:checked');
    return r ? r.value : "date";
  }
  function apply(){
    const cats = checkedCats();
    let hidden = 0;
    rows.forEach(row => {
      const deducted = row.getAttribute("data-deducted") === "1";
      const cat = row.getAttribute("data-cat") || "other";
      // กฎเหล็ก: แถวที่หัก โชว์เสมอ; แถวไม่หัก ซ่อนได้ถ้าไม่ติ๊กหมวด
      const show = deducted || cats.has(cat);
      row.style.display = show ? "" : "none";
      if (!show) hidden++;
    });
    // เรียงตามโหมด: date = ตามวันที่ (default DOM), cat = group ตามหมวด
    if (viewMode() === "cat"){
      rows.slice().sort((a,b) => {
        const ca = a.getAttribute("data-cat"), cb = b.getAttribute("data-cat");
        if (ca !== cb) return ca < cb ? -1 : 1;
        return (a.getAttribute("data-date") || "").localeCompare(b.getAttribute("data-date") || "");
      }).forEach(r => box.appendChild(r));
    } else {
      rows.slice().sort((a,b) =>
        (a.getAttribute("data-date") || "").localeCompare(b.getAttribute("data-date") || "")
      ).forEach(r => box.appendChild(r));
    }
    if (note){
      note.style.display = hidden ? "" : "none";
      note.textContent = hidden ? `ซ่อน ${hidden} รายการที่ไม่หัก (ยอดรวมหัก/สุทธิคิดเต็มเสมอ)` : "";
    }
  }
  document.querySelectorAll('.pettyCatChk, input[name="pettyView"]').forEach(el =>
    el.addEventListener("change", apply));
  apply();
})();

// 1 คน = 1 หน้า: ถ้าสลิปสูงเกิน 1 หน้า A4 → ย่อ (scale) ให้พอดี ตอนพิมพ์
(function () {
  function fitOnePage() {
    const slip = document.querySelector(".slip");
    if (!slip) return;
    fitOneSlip(slip);
  }
  // ย่อสลิปให้พอ 1 หน้า A4 ทั้ง "สูง" และ "กว้าง" (หน้า boss มีคอลัมน์เพิ่ม → ตารางกว้างเกิน)
  function fitOneSlip(slip) {
    slip.style.zoom = "";
    const PAGE_H = 1010;   // A4 portrait usable สูง ~1040px
    const PAGE_W = 720;    // A4 portrait usable กว้าง ~744px (210mm − margin)
    for (let i = 0; i < 6; i++) {
      const r = slip.getBoundingClientRect();
      const cur = parseFloat(slip.style.zoom) || 1;
      // scrollWidth จับ overflow แนวนอน (ตาราง boss กว้างเกิน) ที่ rect ไม่เห็น
      const w = Math.max(r.width, slip.scrollWidth * cur);
      const overH = r.height / PAGE_H, overW = w / PAGE_W;
      const over = Math.max(overH, overW);
      if (over <= 1.0) break;
      const next = Math.max(0.40, cur / over * 0.98);
      if (next >= cur) break;
      slip.style.zoom = next;
    }
  }
  window.addEventListener("load", fitOnePage);
  window.addEventListener("beforeprint", fitOnePage);
  // เผื่อ webfont โหลดช้า → re-fit อีกรอบ
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitOnePage);
  setTimeout(fitOnePage, 400);
})();
</script>

</body>
</html>
