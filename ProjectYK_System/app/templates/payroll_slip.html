<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>สลิปเงินเดือน · {{ employee.full_name }} · {{ run.site_code }} {{ run.pay_cycle_tag }}</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      font-family: "Sarabun", "Tahoma", sans-serif;
      font-size: 12px;
      color: #1f2937;
      margin: 0;
      padding: 0;
      background: #f1f5f9;
    }
    .toolbar {
      max-width: 820px; margin: 12px auto; padding: 8px 12px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px;
    }
    .toolbar a { color: #64748b; text-decoration: none; }
    .toolbar a:hover { text-decoration: underline; }
    .toolbar button {
      padding: 6px 14px; border: 1px solid #94a3b8; border-radius: 6px;
      background: #fff; cursor: pointer; font-size: 12px;
    }
    .toolbar button:hover { background: #f1f5f9; }
    .slip {
      max-width: 820px; margin: 0 auto 24px; padding: 18px 22px;
      background: #fff; border: 1px solid #cbd5e1; border-radius: 4px;
    }
    h1 {
      margin: 0 0 4px; font-size: 18px; font-weight: 700;
      letter-spacing: 0.5px;
    }
    .header-line {
      display: flex; justify-content: space-between; align-items: baseline;
      border-bottom: 2px solid #1f2937; padding-bottom: 6px; margin-bottom: 10px;
    }
    .header-line .meta { font-size: 12px; color: #475569; }
    .driver-line {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 12px; margin-bottom: 12px; font-size: 12px;
    }
    .driver-line .lbl { color: #64748b; font-size: 10px; }
    .driver-line .val { font-weight: 600; }
    table.daily {
      width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 11px;
    }
    table.daily th, table.daily td {
      border: 1px solid #cbd5e1; padding: 3px 6px; text-align: left;
      vertical-align: top;
    }
    table.daily th { background: #f1f5f9; font-weight: 600; font-size: 10px; }
    table.daily td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .row-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px;
    }
    .panel {
      border: 1px solid #cbd5e1; border-radius: 4px; padding: 10px 12px;
    }
    .panel h3 {
      margin: 0 0 6px; font-size: 12px; font-weight: 700; color: #0f172a;
      border-bottom: 1px solid #e2e8f0; padding-bottom: 3px;
    }
    .panel .line {
      display: flex; justify-content: space-between; padding: 2px 0;
      font-size: 12px;
    }
    .panel .line .v { font-variant-numeric: tabular-nums; }
    .panel .total {
      display: flex; justify-content: space-between; padding-top: 4px;
      margin-top: 4px; border-top: 1px dashed #94a3b8;
      font-weight: 700;
    }
    .net-box {
      margin-top: 14px; padding: 14px 18px;
      border: 2px solid #1f2937; border-radius: 6px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .net-box .lbl { font-size: 14px; font-weight: 700; }
    .net-box .val {
      font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .net-pos { color: #047857; }
    .net-neg { color: #b91c1c; }
    .footer-note {
      margin-top: 10px; font-size: 10px; color: #64748b;
      display: flex; justify-content: space-between;
    }
    /* 1 คน = 1 หน้า: เนื้อหายาว (ตารางเดลี่ + รายการหักสดย่อย) → ย่อทั้งสลิปให้พอ A4 */
    .slip.dense table.daily { font-size: 9px; }
    .slip.dense table.daily th, .slip.dense table.daily td { padding: 1px 4px; }
    .slip.dense table.daily th { font-size: 8px; }
    .slip.dense .panel .line, .slip.dense .panel .total { font-size: 9.5px; padding: 0.5px 0; }
    .slip.dense .panel { padding: 6px 8px; }
    .slip.dense .row-grid { gap: 8px; margin-top: 6px; }
    .slip.ultra table.daily { font-size: 7.5px; }
    .slip.ultra table.daily th, .slip.ultra table.daily td { padding: 0.5px 3px; }
    .slip.ultra table.daily th { font-size: 7px; }
    .slip.ultra h1 { font-size: 15px; }
    .slip.ultra .panel .line, .slip.ultra .panel .total { font-size: 8px; padding: 0; }
    .slip.ultra .panel { padding: 4px 6px; }
    .slip.ultra .panel h3 { font-size: 10px; margin-bottom: 3px; }
    .slip.ultra .row-grid { gap: 6px; margin-top: 4px; }
    .slip.ultra .net-box { margin-top: 6px; padding: 8px 14px; }
    .slip.ultra .net-box .val { font-size: 18px; }
    .slip.ultra table.daily { margin: 4px 0; }
    @media print {
      html, body { background: #fff; }
      .toolbar { display: none; }
      .no-print { display: none !important; }
      .slip {
        max-width: 100%; margin: 0; padding: 8mm; border: none;
        border-radius: 0; page-break-after: always;
      }
      /* กันสลิปแตกกลางคัน → 1 คน 1 หน้า */
      .slip { break-inside: avoid; }
      table.daily { break-inside: auto; }
      @page { size: A4 portrait; margin: 7mm; }
    }
  </style>
</head>
<body>

<div class="toolbar">
  <a href="/payroll/{{ run.id }}/employee/{{ employee.id }}">← กลับหน้ารายละเอียด</a>
  <div>
    <button onclick="window.print()">🖨 พิมพ์สลิป</button>
  </div>
</div>

{% include "_slip_body.html" %}

<script>
(function(){
  const box = document.getElementById("pettyLines");
  if (!box) return;
  const note = document.getElementById("pettyHiddenNote");
  const rows = Array.from(box.querySelectorAll(".petty-row"));

  function checkedCats(){
    return new Set(Array.from(document.querySelectorAll(".pettyCatChk"))
                        .filter(c => c.checked).map(c => c.value));
  }
  function viewMode(){
    const r = document.querySelector('input[name="pettyView"]:checked');
    return r ? r.value : "date";
  }
  function apply(){
    const cats = checkedCats();
    let hidden = 0;
    rows.forEach(row => {
      const deducted = row.getAttribute("data-deducted") === "1";
      const cat = row.getAttribute("data-cat") || "other";
      // กฎเหล็ก: แถวที่หัก โชว์เสมอ; แถวไม่หัก ซ่อนได้ถ้าไม่ติ๊กหมวด
      const show = deducted || cats.has(cat);
      row.style.display = show ? "" : "none";
      if (!show) hidden++;
    });
    // เรียงตามโหมด: date = ตามวันที่ (default DOM), cat = group ตามหมวด
    if (viewMode() === "cat"){
      rows.slice().sort((a,b) => {
        const ca = a.getAttribute("data-cat"), cb = b.getAttribute("data-cat");
        if (ca !== cb) return ca < cb ? -1 : 1;
        return (a.getAttribute("data-date") || "").localeCompare(b.getAttribute("data-date") || "");
      }).forEach(r => box.appendChild(r));
    } else {
      rows.slice().sort((a,b) =>
        (a.getAttribute("data-date") || "").localeCompare(b.getAttribute("data-date") || "")
      ).forEach(r => box.appendChild(r));
    }
    if (note){
      note.style.display = hidden ? "" : "none";
      note.textContent = hidden ? `ซ่อน ${hidden} รายการที่ไม่หัก (ยอดรวมหัก/สุทธิคิดเต็มเสมอ)` : "";
    }
  }
  document.querySelectorAll('.pettyCatChk, input[name="pettyView"]').forEach(el =>
    el.addEventListener("change", apply));
  apply();
})();

// 1 คน = 1 หน้า: ถ้าสลิปสูงเกิน 1 หน้า A4 → ย่อ (scale) ให้พอดี ตอนพิมพ์
(function () {
  function fitOnePage() {
    const slip = document.querySelector(".slip");
    if (!slip) return;
    fitOneSlip(slip);
  }
  // ย่อสลิปให้พอ 1 หน้า A4 ทั้ง "สูง" และ "กว้าง" (หน้า boss มีคอลัมน์เพิ่ม → ตารางกว้างเกิน)
  function fitOneSlip(slip) {
    slip.style.zoom = "";
    const PAGE_H = 1010;   // A4 portrait usable สูง ~1040px
    const PAGE_W = 720;    // A4 portrait usable กว้าง ~744px (210mm − margin)
    for (let i = 0; i < 6; i++) {
      const r = slip.getBoundingClientRect();
      const cur = parseFloat(slip.style.zoom) || 1;
      // scrollWidth จับ overflow แนวนอน (ตาราง boss กว้างเกิน) ที่ rect ไม่เห็น
      const w = Math.max(r.width, slip.scrollWidth * cur);
      const overH = r.height / PAGE_H, overW = w / PAGE_W;
      const over = Math.max(overH, overW);
      if (over <= 1.0) break;
      const next = Math.max(0.40, cur / over * 0.98);
      if (next >= cur) break;
      slip.style.zoom = next;
    }
  }
  window.addEventListener("load", fitOnePage);
  window.addEventListener("beforeprint", fitOnePage);
  // เผื่อ webfont โหลดช้า → re-fit อีกรอบ
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitOnePage);
  setTimeout(fitOnePage, 400);
})();
</script>

</body>
</html>
