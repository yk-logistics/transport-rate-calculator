{% extends "driver_base.html" %}
{% set active = 'checkin' %}
{% block title %}เช็คอิน · YK Driver{% endblock %}

{% block content %}
<div class="mb-3">
  <div class="text-xl font-bold">📍 เช็คอิน</div>
  <div class="text-sm text-slate-500">กดตอนถึงจุด — ระบบจดเวลา+พิกัดให้เอง</div>
</div>

<form method="post" action="/driver/checkin" enctype="multipart/form-data" class="space-y-3">

  <div class="bg-white rounded-xl p-4 border">
    <label class="text-sm font-medium">อยู่จุดไหน</label>
    <div class="grid grid-cols-1 gap-2 mt-2">
      {% for val, label in points %}
      <label class="flex items-center gap-3 border rounded-xl px-4 py-3 has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
        <input type="radio" name="point" value="{{ val }}" required class="w-5 h-5">
        <span class="text-base font-medium">{{ label }}</span>
      </label>
      {% endfor %}
    </div>
  </div>

  <div class="bg-white rounded-xl p-4 border">
    <label class="text-sm text-slate-600">งานของวันนี้ (ถ้ามีในระบบ)</label>
    <select name="daily_job_id" class="w-full border rounded-xl px-3 py-2.5 mt-1">
      <option value="">-- ไม่ระบุ --</option>
      {% for j in jobs %}
      <option value="{{ j.id }}">{{ j.status_code }} {{ j.destination or j.pickup_location }} {{ j.container_no }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="bg-white rounded-xl p-4 border">
    <label class="text-sm font-medium">ถ่ายรูป (ถ้ามี)</label>
    <input type="file" name="photos" accept="image/*" capture="environment" multiple
           class="w-full mt-2 text-sm" id="photo-input" />
    <div id="photo-preview" class="grid grid-cols-3 gap-2 mt-2"></div>
  </div>

  <div class="bg-white rounded-xl p-4 border">
    <label class="text-sm font-medium">หมายเหตุ</label>
    <textarea name="note" rows="2" class="w-full border rounded-xl px-3 py-2 mt-1"
              placeholder="เช่น รอคิวหน้าลาน"></textarea>
  </div>

  <input type="hidden" name="gps_lat" id="gps_lat" />
  <input type="hidden" name="gps_lng" id="gps_lng" />
  <input type="hidden" name="gps_acc" id="gps_acc" />

  <button type="submit" class="btn-lg bg-blue-600 text-white">📍 เช็คอิน</button>
</form>

<script>
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      document.getElementById('gps_lat').value = pos.coords.latitude;
      document.getElementById('gps_lng').value = pos.coords.longitude;
      document.getElementById('gps_acc').value = pos.coords.accuracy;
    }, null,
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
  );
}
document.getElementById('photo-input').addEventListener('change', async (e) => {
  const preview = document.getElementById('photo-preview');
  preview.innerHTML = '';
  const dt = new DataTransfer();
  for (const file of Array.from(e.target.files)) {
    try {
      const c = await compressImage(file, 1280, 0.75);
      dt.items.add(c);
      const img = document.createElement('img');
      img.src = URL.createObjectURL(c);
      img.className = 'w-full h-20 object-cover rounded-lg';
      preview.appendChild(img);
    } catch (err) { dt.items.add(file); }
  }
  e.target.files = dt.files;
});
async function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = h * (maxDim / w); w = maxDim; } else { w = w * (maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob((blob) => {
        if (!blob) return reject();
        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'),
                { type: 'image/jpeg', lastModified: Date.now() }));
      }, 'image/jpeg', quality);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
</script>
{% endblock %}
