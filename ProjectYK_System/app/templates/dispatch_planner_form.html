{% extends "base.html" %}
{% block title %}สร้างแผนงานใหม่{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto">
  <div class="flex items-center gap-2 mb-4">
    <a href="/dispatch/planner" class="text-slate-400 hover:text-slate-600 text-sm">← กลับ</a>
    <h1 class="text-xl font-bold">📋 สร้างแผนงานใหม่</h1>
  </div>

  <form method="post" action="/dispatch/planner/new" class="bg-white rounded-lg border p-5 space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">วันที่แผนงาน <span class="text-red-500">*</span></label>
        <input type="date" name="plan_date" required
               value="{{ default_date or today }}"
               class="border rounded px-3 py-2 w-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">ไซท์ <span class="text-red-500">*</span></label>
        <select name="site_code" class="border rounded px-3 py-2 w-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
          {% for s in sites %}
          <option value="{{ s }}" {% if s==default_site %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">สร้างโดย (ชื่อหัวหน้า)</label>
      <input type="text" name="created_by" placeholder="เช่น หัวหน้าต้อย"
             class="border rounded px-3 py-2 w-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">หมายเหตุ</label>
      <textarea name="notes" rows="2" placeholder="ข้อความเพิ่มเติมสำหรับคนขับ"
                class="border rounded px-3 py-2 w-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"></textarea>
    </div>

    <div class="flex gap-2 pt-2">
      <button type="submit" class="bg-slate-900 text-white px-5 py-2 rounded text-sm hover:bg-slate-700">
        สร้างแผน →
      </button>
      <a href="/dispatch/planner" class="px-4 py-2 rounded text-sm border text-slate-600 hover:bg-slate-50">ยกเลิก</a>
    </div>
  </form>
</div>

{% endblock %}
