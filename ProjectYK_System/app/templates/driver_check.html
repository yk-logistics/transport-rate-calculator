{% extends "driver_base.html" %}
{% set active = 'check' %}
{% block title %}ตรวจรถก่อนวิ่ง · YK Driver{% endblock %}

{% block content %}
<div class="mb-3">
  <div class="text-xl font-bold">🔧 ตรวจรถก่อนวิ่ง</div>
  <div class="text-sm text-slate-500">{{ today }} · {{ now }}</div>
</div>

<form method="post" action="/driver/check" enctype="multipart/form-data" class="space-y-3"
      id="check-form">

  <div class="bg-white rounded-xl p-4 border space-y-3">
    <div>
      <label class="text-sm text-slate-600">รถที่ใช้วันนี้</label>
      <select name="vehicle_id" class="w-full border rounded-xl px-3 py-2.5 mt-1">
        <option value="">-- เลือกรถ --</option>
        {% for v in vehicles %}
          <option value="{{ v.id }}">{{ v.plate_no }} ({{ v.kind or '' }})</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="text-sm text-slate-600">หรือพิมพ์ทะเบียน</label>
      <input type="text" name="plate_raw" class="w-full border rounded-xl px-3 py-2.5 mt-1"
             placeholder="70-1234, 80-1234" />
    </div>
  </div>

  {# CHECKLIST #}
  <div class="bg-white rounded-xl border divide-y">
    {% for key, label in check_items %}
    <div class="p-3">
      <div class="flex items-center justify-between">
        <div class="text-sm font-medium flex-1">{{ label }}</div>
        <select name="item_{{ key }}" class="border rounded-lg px-2 py-1.5 text-sm"
                onchange="toggleNote(this, '{{ key }}')">
          {% for val, lbl in check_status_opts %}
            <option value="{{ val }}" {% if val=='ok' %}selected{% endif %}>{{ lbl }}</option>
          {% endfor %}
        </select>
      </div>
      <input type="text" name="note_{{ key }}" id="note-{{ key }}"
             class="w-full border rounded-lg px-3 py-1.5 text-sm mt-2 hidden"
             placeholder="ระบุอาการ (ถ้ามี)" />
    </div>
    {% endfor %}
  </div>

  {# PHOTOS #}
  <div class="bg-white rounded-xl p-4 border">
    <label class="text-sm font-medium">ถ่ายรูปจุดที่ต้องการ (เลือกได้หลายรูป)</label>
    <input type="file" name="photos" accept="image/*" capture="environment" multiple
           class="w-full mt-2 text-sm"
           id="photo-input" />
    <div id="photo-preview" class="grid grid-cols-3 gap-2 mt-2"></div>
  </div>

  {# NOTE #}
  <div class="bg-white rounded-xl p-4 border">
    <label class="text-sm font-medium">หมายเหตุเพิ่มเติม</label>
    <textarea name="note" rows="2" class="w-full border rounded-xl px-3 py-2 mt-1"
              placeholder="อื่น ๆ..."></textarea>
  </div>

  <input type="hidden" name="gps_lat" id="gps_lat" />
  <input type="hidden" name="gps_lng" id="gps_lng" />
  <input type="hidden" name="gps_acc" id="gps_acc" />

  <button type="submit" class="btn-lg bg-blue-600 text-white">✓ ส่งผลตรวจรถ</button>
</form>

<script>
function toggleNote(sel, key) {
  const note = document.getElementById('note-' + key);
  if (sel.value === 'warn' || sel.value === 'fail') {
    note.classList.remove('hidden');
  } else {
    note.classList.add('hidden');
  }
}

// Request GPS on load (non-blocking)
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      document.getElementById('gps_lat').value = pos.coords.latitude;
      document.getElementById('gps_lng').value = pos.coords.longitude;
      document.getElementById('gps_acc').value = pos.coords.accuracy;
    },
    null,
    { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
  );
}

// Photo preview + client-side compression
document.getElementById('photo-input').addEventListener('change', async (e) => {
  const preview = document.getElementById('photo-preview');
  preview.innerHTML = '';
  const files = Array.from(e.target.files);
  const dt = new DataTransfer();
  for (const file of files) {
    try {
      const compressed = await compressImage(file, 1280, 0.75);
      dt.items.add(compressed);
      const url = URL.createObjectURL(compressed);
      const img = document.createElement('img');
      img.src = url;
      img.className = 'w-full h-20 object-cover rounded-lg';
      preview.appendChild(img);
    } catch (err) {
      dt.items.add(file);
    }
  }
  e.target.files = dt.files;
});

async function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = h * (maxDim / w); w = maxDim; }
        else { w = w * (maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob((blob) => {
        if (!blob) return reject();
        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'),
                { type: 'image/jpeg', lastModified: Date.now() }));
      }, 'image/jpeg', quality);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
</script>
{% endblock %}
